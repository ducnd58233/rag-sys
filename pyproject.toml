[project]
name = "rag-sys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "elasticsearch>=9.4.1",
    "fastapi>=0.139.0",
    "langchain>=1.3.12",
    "langchain-core>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "unstructured[docx,md,pdf]>=0.24.0",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
only-include = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.isort]
profile = "black"
src_paths = ["src"]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.0",
]

[tool.poe.tasks]
lint = "pre-commit run --all-files"

[project.scripts]
app = "src.app.main:run"
dev = "src.app.main:run_dev"
