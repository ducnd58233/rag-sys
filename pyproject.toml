[project]
name = "rag-sys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
only-include = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.isort]
profile = "black"
src_paths = ["src"]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.0",
]

[tool.poe.tasks]
lint = "pre-commit run --all-files"
