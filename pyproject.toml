[project]
name = "rag-sys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "aiokafka>=0.14.0",
    "alembic[tz]>=1.18.5",
    "asyncpg>=0.31.0",
    "elasticsearch>=9.4.1",
    "fastapi>=0.139.0",
    "langchain>=1.3.12",
    "langchain-core>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "minio>=7.2.20",
    "neo4j>=6.2.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "opentelemetry-instrumentation-elasticsearch>=0.64b0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
    "opentelemetry-instrumentation-system-metrics>=0.64b0",
    "opentelemetry-sdk>=1.43.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "snowflake-id>=1.0.2",
    "sqlalchemy>=2.0.51",
    "unstructured-inference>=1.6.12,<2.0.0",
    "unstructured[docx,md,pdf]>=0.24.0",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
only-include = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.isort]
profile = "black"
src_paths = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that need Docker via testcontainers, excluded by default",
]
# Scoped to tests/modules and tests/evaluation, not just marker-filtered:
# collecting tests/integration at all imports testcontainers and its Docker
# client, which costs real time even when every test in it is deselected.
testpaths = ["tests/modules", "tests/evaluation"]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[elasticsearch,neo4j,postgres]>=4.14.2",
]

[tool.poe.tasks]
lint = "pre-commit run --all-files"
migrate-new = 'alembic revision'
migrate-up = 'alembic upgrade head'
migrate-down = 'alembic downgrade -1'
migrate-down-all = 'alembic downgrade base'
test = "pytest"
test-integration = "pytest tests/integration -m integration"
eval-download-corpus = "python scripts/evaluation/download_bioasq.py"
eval-index-corpus = "python scripts/evaluation/index_corpus.py"
eval-dev = "python scripts/evaluation/run.py --split dev"

[project.scripts]
app = "src.app.api.main:run"
dev = "src.app.api.main:run_dev"
worker = "src.app.worker.main:run"
