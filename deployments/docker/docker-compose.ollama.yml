name: rag-sys

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Keep chat + embedding loaded together to avoid mid-request model swaps.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              options:
                memory: 4096
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-batiai/qwen3-embedding:0.6b}
      # qwen2.5:1.5b was the prior default; 3b is a small step up that still fits
      # ~4GB VRAM alongside the 0.6b embedding model (OLLAMA_MAX_LOADED_MODELS=2).
      OLLAMA_CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:3b}
      OLLAMA_WARMUP_ENABLED: ${OLLAMA_WARMUP_ENABLED:-true}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "Pulling chat: $${OLLAMA_CHAT_MODEL}"
        ollama pull "$${OLLAMA_CHAT_MODEL}"
        echo "Pulling embedding: $${OLLAMA_EMBEDDING_MODEL}"
        ollama pull "$${OLLAMA_EMBEDDING_MODEL}"
        if [ "$${OLLAMA_WARMUP_ENABLED}" = "true" ]; then
          echo "Warming chat model (embedding warmup happens in app startup)"
          printf 'ping\n' | ollama run "$${OLLAMA_CHAT_MODEL}" >/dev/null
        fi
        echo "All Ollama models ready"
    restart: "no"

volumes:
  ollama_data:
