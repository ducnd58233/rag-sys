name: rag-sys

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              options:
                memory: 4096
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-batiai/qwen3-embedding:0.6b}
      OLLAMA_RERANK_MODEL: ${RERANK_MODEL:-qwen3-reranker:0.6b}
      OLLAMA_CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:1.5b}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "set -e;
       echo 'Pulling embedding: $${OLLAMA_EMBEDDING_MODEL}';
       ollama pull $${OLLAMA_EMBEDDING_MODEL};
       echo 'Pulling rerank: $${OLLAMA_RERANK_MODEL}';
       ollama pull $${OLLAMA_RERANK_MODEL};
       echo 'Pulling chat: $${OLLAMA_CHAT_MODEL}';
       ollama pull $${OLLAMA_CHAT_MODEL};
       echo 'All Ollama models ready'"
    restart: "no"

volumes:
  ollama_data: