groups:
  - name: slo-api
    interval: 30s
    rules:
      - record: slo:http_request_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, http_route, service_name) (
              rate(http_server_request_duration_seconds_bucket[5m])
            )
          )

      - record: slo:http_request_duration:p99
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, http_route, service_name) (
              rate(http_server_request_duration_seconds_bucket[5m])
            )
          )

      - record: slo:http_availability:ratio_rate5m
        expr: |
          sum by (service_name) (
            rate(http_server_request_duration_seconds_count{http_response_status_code!~"5.."}[5m])
          )
          /
          sum by (service_name) (
            rate(http_server_request_duration_seconds_count[5m])
          )

      - record: slo:http_availability:ratio_rate1h
        expr: |
          sum by (service_name) (
            rate(http_server_request_duration_seconds_count{http_response_status_code!~"5.."}[1h])
          )
          /
          sum by (service_name) (
            rate(http_server_request_duration_seconds_count[1h])
          )

      - record: slo:http_availability:ratio_rate30m
        expr: |
          sum by (service_name) (
            rate(http_server_request_duration_seconds_count{http_response_status_code!~"5.."}[30m])
          )
          /
          sum by (service_name) (
            rate(http_server_request_duration_seconds_count[30m])
          )

      - record: slo:http_availability:ratio_rate6h
        expr: |
          sum by (service_name) (
            rate(http_server_request_duration_seconds_count{http_response_status_code!~"5.."}[6h])
          )
          /
          sum by (service_name) (
            rate(http_server_request_duration_seconds_count[6h])
          )

  - name: slo-ingestion
    interval: 30s
    rules:
      - record: slo:ingestion_step_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, step) (
              rate(rag_ingestion_step_duration_seconds_bucket[5m])
            )
          )

      - record: slo:messaging_publish_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, messaging_destination_name) (
              rate(rag_messaging_publish_duration_seconds_bucket[5m])
            )
          )

      - record: slo:messaging_consume_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, messaging_destination_name) (
              rate(rag_messaging_consume_duration_seconds_bucket[5m])
            )
          )

      - record: slo:generation_ask_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, outcome, strategy) (
              rate(rag_generation_ask_duration_seconds_bucket[5m])
            )
          )

      - record: slo:generation_query_analysis_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, outcome) (
              rate(rag_generation_query_analysis_duration_seconds_bucket[5m])
            )
          )

      - record: slo:generation_retrieval_query_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, query_kind, outcome) (
              rate(rag_generation_retrieval_query_duration_seconds_bucket[5m])
            )
          )

      - record: slo:generation_context_merge_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, strategy) (
              rate(rag_generation_context_merge_duration_seconds_bucket[5m])
            )
          )

      - record: slo:gen_ai_client_operation_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, gen_ai_operation_name, gen_ai_request_model) (
              rate(gen_ai_client_operation_duration_seconds_bucket[5m])
            )
          )

      - record: slo:gen_ai_client_operation_duration:p99
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, gen_ai_operation_name, gen_ai_request_model) (
              rate(gen_ai_client_operation_duration_seconds_bucket[5m])
            )
          )
