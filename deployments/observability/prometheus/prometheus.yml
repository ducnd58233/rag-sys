global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: kafka-jmx
    static_configs:
      - targets: ["kafka-jmx-exporter:5556"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
