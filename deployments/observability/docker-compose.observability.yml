name: rag-sys

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./otel-collector/config.yaml:/etc/otel/config.yaml:ro
      - ./otel-collector/config.langfuse.yaml:/etc/otel/config.langfuse.yaml:ro
    environment:
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-http://langfuse:3000/api/public/otel}
      LANGFUSE_BASIC_AUTH: ${LANGFUSE_BASIC_AUTH:-cGstbGYtZGV2OnNrLWxmLWRldg==}
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - '3200:3200'
    restart: unless-stopped

  kafka-jmx-exporter:
    image: sscaling/jmx-prometheus-exporter:0.12.0
    volumes:
      - ./kafka/jmx-exporter-config.yml:/opt/jmx_exporter/config.yml:ro
    ports:
      - '5556:5556'
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - '8081:8080'
    restart: unless-stopped

volumes:
  prometheus_data:
  tempo_data:
